<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18D4E8"/>
      <stop offset="100%" stop-color="#28D7B0"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18D4E8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#070C12" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background hexagon -->
  <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" fill="#0D1824" stroke="url(#cyanGrad)" stroke-width="3"/>
  <!-- Mine open-pit bench stepped contours -->
  <polygon points="50,18 80,34 80,66 50,82 20,66 20,34" fill="#132130" stroke="#18D4E8" stroke-width="1.5" stroke-dasharray="3,2"/>
  <polygon points="50,30 70,41 70,59 50,70 30,59 30,41" fill="#182E42" stroke="#28D7B0" stroke-width="2"/>
  <!-- Neural Synapse Core -->
  <circle cx="50" cy="50" r="7" fill="url(#cyanGrad)"/>
  <line x1="50" y1="50" x2="50" y2="18" stroke="#18D4E8" stroke-width="2"/>
  <line x1="50" y1="50" x2="80" y2="66" stroke="#28D7B0" stroke-width="2"/>
  <line x1="50" y1="50" x2="20" y2="66" stroke="#18D4E8" stroke-width="2"/>
  <circle cx="50" cy="18" r="3.5" fill="#F2AA3B"/>
  <circle cx="80" cy="66" r="3.5" fill="#18D4E8"/>
  <circle cx="20" cy="66" r="3.5" fill="#28D7B0"/>
</svg>
