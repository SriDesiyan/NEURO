<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 60" fill="none">
  <defs>
    <linearGradient id="logoCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18D4E8"/>
      <stop offset="100%" stop-color="#28D7B0"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2F1F8"/>
    </linearGradient>
  </defs>
  
  <!-- Icon Mark -->
  <g transform="translate(6, 6) scale(0.48)">
    <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" fill="#101C28" stroke="url(#logoCyan)" stroke-width="4"/>
    <polygon points="50,18 80,34 80,66 50,82 20,66 20,34" fill="#152738" stroke="#18D4E8" stroke-width="2.5" stroke-dasharray="4,2"/>
    <polygon points="50,30 70,41 70,59 50,70 30,59 30,41" fill="#1A334A" stroke="#28D7B0" stroke-width="3"/>
    <circle cx="50" cy="50" r="9" fill="url(#logoCyan)"/>
    <line x1="50" y1="50" x2="50" y2="18" stroke="#18D4E8" stroke-width="3"/>
    <line x1="50" y1="50" x2="80" y2="66" stroke="#28D7B0" stroke-width="3"/>
    <line x1="50" y1="50" x2="20" y2="66" stroke="#18D4E8" stroke-width="3"/>
    <circle cx="50" cy="18" r="4.5" fill="#F2AA3B"/>
    <circle cx="80" cy="66" r="4.5" fill="#18D4E8"/>
    <circle cx="20" cy="66" r="4.5" fill="#28D7B0"/>
  </g>

  <!-- Brand Typography -->
  <text x="64" y="32" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="0.5" fill="url(#textGrad)">
    Neuro<tspan fill="#18D4E8">Symbio</tspan><tspan fill="#28D7B0">Mine</tspan>
  </text>
  <text x="65" y="47" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" letter-spacing="1.8" fill="#8FA4B8">
    COGNITIVE MINING DIGITAL TWIN
  </text>

  <!-- Pulse Status Dot -->
  <circle cx="340" cy="27" r="4" fill="#28D7B0">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="350" y="30" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" letter-spacing="1.2" fill="#28D7B0">
    LIVE
  </text>
</svg>
